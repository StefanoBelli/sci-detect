name: build and test kernel module, then run examples

on:
  push:
    branches:
      - main
      - good 
  pull_request:
    branches:
      - main
      - good

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Show kernel version
      run: uname -s -r
    - name: Update apt sources
      run: sudo apt update
    - name: Install kernel headers, libnl-3, binutils-dev
      run: sudo apt install -y linux-headers-$(uname -r) libnl-3-dev libnl-genl-3-dev binutils-dev
    - name: Build the module
      run: make kernel-testing
    - name: Show THP and mem compaction status BEFORE moving to madvise
      run: ./scripts/show-thp-and-compaction.sh
    - name: Set THP status to madvise, disable mem compaction
      run: sudo ./scripts/disable-thp-madvise-and-compaction.sh
    - name: Show THP and mem compaction status AFTER moving to madvise
      run: ./scripts/show-thp-and-compaction.sh
    - name: Clear dmesg
      run: sudo dmesg --clear
    - name: Setup kernel module
      run: sudo make module-mount
    - name: Finally, run tests
      run: sudo make run-tests
    - name: Show dmesg
      if: always()
      run: sudo dmesg
    - name: Make libscid and scid CLI
      run: make user
    - name: Run examples
      run: sudo make run-examples
    - name: Clean examples
      run: sudo make examples-clean
    - name: Run mlocked examples
      run: sudo make run-mlocked-examples
    - name: Clear dmesg
      run: sudo dmesg --clear
    - name: Teardown kernel module
      run: sudo make module-umount
    - name: Show dmesg
      if: always()
      run: sudo dmesg

